# ==============================================================================
# 115 Cloud Drive Share Search Service (115 分享资源搜索服务)
# 生产环境部署编排文件 (Production Docker Compose - 零 .env 依赖纯净版)
# 
# 启动方式:
#   直接执行命令即可，无需配置或创建任何 .env 文件！
#   docker compose -f docker-compose.prod.yml up -d
#
# 所有业务配置（115 VIP Cookie、爬虫并发、代理池、看门狗、Google AdSense、管理员密码）
# 均在部署后通过 Web 管理后台直接修改并持久化存入 PostgreSQL 数据库，支持秒级热生效！
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 15 (开启 pg_trgm 扩展，支持百万级文件名三元分词 GIN 倒排检索)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: 115_postgres_prod
    restart: always
    shm_size: 512m
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c max_connections=200
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-db_115share}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_115share}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - 115_network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (任务队列与抓取去重缓存)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: 115_redis_prod
    restart: always
    command: >
      redis-server 
      --appendonly yes 
      --requirepass redis123 
      --maxmemory 512mb 
      --maxmemory-policy noeviction
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - 115_network

  # ----------------------------------------------------------------------------
  # 3. FastAPI Web REST API (支持多 Worker、生产级反向代理头、健康检查)
  # ----------------------------------------------------------------------------
  api:
    image: ghcr.io/minyoad/115share_searcher:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 115_api_prod
    restart: always
    command: >
      uvicorn app.main:app 
      --host 0.0.0.0 
      --port 8000 
      --workers 4 
      --proxy-headers 
      --forwarded-allow-ips='*' 
      --access-log
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-db_115share}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - 115_network

  # ----------------------------------------------------------------------------
  # 4. Background Crawler Worker (异步队列消费，BFS 遍历与批量入库)
  # ----------------------------------------------------------------------------
  worker:
    image: ghcr.io/minyoad/115share_searcher:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 115_worker_prod
    restart: always
    command: python -m app.worker
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-db_115share}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - 115_network

# ------------------------------------------------------------------------------
# 存储卷与网络配置
# ------------------------------------------------------------------------------
volumes:
  pgdata:
    name: 115_pgdata_prod
    driver: local
  redisdata:
    name: 115_redisdata_prod
    driver: local

networks:
  115_network:
    name: 115_service_net
    driver: bridge
