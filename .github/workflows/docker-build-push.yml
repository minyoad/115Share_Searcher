name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      push_image:
        description: '是否推送镜像到 GHCR (true / false)'
        required: true
        default: 'true'
        type: boolean
      custom_tag:
        description: '自定义镜像标签 (可选，默认使用分支/Tag)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  # 自动使用 github.repository 转换为全小写镜像名 (e.g. ghcr.io/username/115share-search)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Architecture Emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # (可选) 若需要推送到 Docker Hub，配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 密钥后自动生效
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            ${{ inputs.custom_tag != '' && format('type=raw,value={0}', inputs.custom_tag) || '' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # PR 触发时仅编译验证，不推送到镜像仓库；主分支合并或 Release 打 tag 时推送
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 缓存构建层，极大缩短二次编译时间
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Tags
        run: |
          echo "=========================================="
          echo "Docker Image successfully built!"
          echo "Tags generated:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "=========================================="
